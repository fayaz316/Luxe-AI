<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta
      name="description"
      content="Lux Copilot — the advisor workspace for Lux. Client intelligence and AI-drafted replies, gated on explicit human approval."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Lux Copilot</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #faf8f5;
        color: #1a1a1a;
      }
      .boot-mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #1a1a1a;
        color: #b08d57;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot p {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6f675b;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <span class="boot-mark">L</span>
        <p>Lux Copilot</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
